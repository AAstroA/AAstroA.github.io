name: Apply Persian site v2

on:
  push:
    branches:
      - codex/add-persian-achaemenid

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Persian pages and Achaemenid theme
        shell: bash
        run: |
          cat .persian-payload/part*.txt > /tmp/persian-site.b64
          base64 --decode /tmp/persian-site.b64 > /tmp/persian-site.tar.gz
          echo "94dfc87add4f9dbdac67eda3bb783796c8c1343efa47e5b851905838ae3fbb8e  /tmp/persian-site.tar.gz" | sha256sum --check
          tar -xzf /tmp/persian-site.tar.gz -C .

          rm -rf .persian-payload
          rm -f .github/workflows/apply-persian-site.yml
          rm -f .github/workflows/apply-persian-site-fix.yml
          rm -f .github/workflows/apply-persian-site-v2.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Persian Achaemenid-inspired experience"
          git push
