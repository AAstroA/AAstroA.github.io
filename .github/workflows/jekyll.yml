# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore CV PDF
        run: |
          mkdir -p files
          cat \
            _cv_pdf_chunks/00.b64 \
            _cv_pdf_chunks/01.b64 \
            _cv_pdf_chunks/02.b64 \
            _cv_pdf_chunks/03.b64 \
            _cv_pdf_chunks/04.b64 \
            _cv_pdf_chunks/05.b64 \
            _cv_pdf_chunks/06.b64 \
            _cv_pdf_chunks/06a.b64 \
            _cv_pdf_chunks/06b.b64 \
            _cv_pdf_chunks/07a.b64 \
            _cv_pdf_chunks/07b.b64 \
            _cv_pdf_chunks/08a.b64 \
            _cv_pdf_chunks/08b.b64 \
            _cv_pdf_chunks/09a.b64 \
            _cv_pdf_chunks/09b.b64 \
            | base64 --decode > files/alireza-moslemihaghighi-cv.pdf
          echo "63550536275492ddfce7f03299401ab7ad4a7ddd13b7c561f0902116f5afa749  files/alireza-moslemihaghighi-cv.pdf" | sha256sum -c -
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
