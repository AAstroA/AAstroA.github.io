name: Apply Persian site

on:
  push:
    branches: ["codex/add-persian-achaemenid"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Persian pages and theme
        shell: bash
        run: |
          cat > /tmp/persian-site.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/persian-site.b64 > /tmp/persian-site.tar.gz
          echo "94dfc87add4f9dbdac67eda3bb783796c8c1343efa47e5b851905838ae3fbb8e  /tmp/persian-site.tar.gz" | sha256sum --check
          tar -xzf /tmp/persian-site.tar.gz -C .
          rm -f .github/workflows/apply-persian-site.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Persian Achaemenid-inspired experience"
          git push
