name: One-time homepage and research fix

on:
  push:
    branches:
      - codex/fix-ai-card-portrait

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-ai-card-portrait
          fetch-depth: 0

      - name: Apply requested text fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          about = Path('_pages/about.md')
          text = about.read_text()

          pattern = re.compile(
              r'(<p class="card-index">02 · AI in Finance</p>\s*)'
              r'<h3>.*?</h3>\s*'
              r'<p>.*?</p>\s*'
              r'<p class="card-meta">.*?</p>',
              re.S,
          )
          replacement = (
              r'\1'
              '<h3>Artificial intelligence and the transformation of skilled work</h3>\n'
              '<p>A macroeconomic model of how AI changes human-capital formation, career progression, and the junior-senior composition of skilled employment.</p>\n'
              '<p class="card-meta">With M. Croce and S. Raymond</p>'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to update one homepage AI card; updated {count}')
          about.write_text(text)

          research = Path('_pages/research.md')
          text = research.read_text()
          sentence = 'Skilled work is one important margin within this larger agenda, rather than the defining scope of it.'
          if sentence not in text:
              raise SystemExit('Research-page sentence was not found')
          text = text.replace(' ' + sentence, '').replace(sentence, '')
          research.write_text(text)
          PY

      - name: Repair portrait asset
        shell: bash
        run: |
          mkdir -p images
          curl -fsSL "https://avatars.githubusercontent.com/u/105180378?s=640" -o images/alireza-portrait-2026.jpg
          test -s images/alireza-portrait-2026.jpg
          test "$(wc -c < images/alireza-portrait-2026.jpg)" -gt 10000

      - name: Commit requested fixes and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-content-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix AI card copy and homepage portrait"
          git push origin HEAD:codex/fix-ai-card-portrait
