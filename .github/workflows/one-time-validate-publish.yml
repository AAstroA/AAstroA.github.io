name: One-time validate and publish fixes

on:
  push:
    branches:
      - codex/fix-ai-card-portrait

permissions:
  contents: write
  actions: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-ai-card-portrait
          fetch-depth: 0

      - name: Re-apply requested changes safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          about = Path('_pages/about.md')
          text = about.read_text()
          pattern = re.compile(
              r'(<p class="card-index">02 · AI in Finance</p>\s*)'
              r'<h3>.*?</h3>\s*'
              r'<p>.*?</p>\s*'
              r'<p class="card-meta">.*?</p>',
              re.S,
          )
          replacement = (
              r'\1'
              '<h3>Artificial intelligence and the transformation of skilled work</h3>\n'
              '<p>A macroeconomic model of how AI changes human-capital formation, career progression, and the junior-senior composition of skilled employment.</p>\n'
              '<p class="card-meta">With M. Croce and S. Raymond</p>'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one homepage AI card, found {count}')
          about.write_text(text)

          research = Path('_pages/research.md')
          text = research.read_text()
          sentence = 'Skilled work is one important margin within this larger agenda, rather than the defining scope of it.'
          text = text.replace(' ' + sentence, '').replace(sentence, '')
          research.write_text(text)
          PY

          mkdir -p images
          curl -fsSL "https://avatars.githubusercontent.com/u/105180378?s=640" -o images/alireza-portrait-2026.jpg
          test "$(wc -c < images/alireza-portrait-2026.jpg)" -gt 10000

          rm -f tmp-marker-do-not-merge.txt
          rm -f .github/workflows/one-time-content-fix.yml
          rm -f .github/workflows/one-time-finalize.yml
          rm -f .github/workflows/one-time-validate-publish.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Fix homepage AI card, research copy, and portrait"
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Fast-forward production
        shell: bash
        run: |
          git fetch origin master
          git merge-base --is-ancestor origin/master HEAD
          git push origin HEAD:master

      - name: Dispatch Pages workflow when supported
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "workflow_dispatch" .github/workflows/jekyll.yml; then
            gh workflow run jekyll.yml --ref master
          fi
