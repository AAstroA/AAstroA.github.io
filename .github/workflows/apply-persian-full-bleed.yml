name: Apply Persian full-bleed overhaul

on:
  push:
    branches:
      - codex/persian-full-bleed-overhaul
    paths:
      - '.codex-persian/**'
      - '.github/workflows/apply-persian-full-bleed.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/persian-full-bleed-overhaul

      - name: Install redesign
        shell: bash
        run: |
          cat \
            .codex-persian/chunk-000 \
            .codex-persian/chunk-001 \
            .codex-persian/chunk-002 \
            .codex-persian/chunk-003 \
            .codex-persian/chunk-004 \
            .codex-persian/chunk-005 \
            .codex-persian/chunk-009 \
            .codex-persian/chunk-010 \
            .codex-persian/chunk-011 \
            .codex-persian/chunk-012 \
            .codex-persian/chunk-013 \
            > /tmp/persian-overhaul.b64
          base64 --decode /tmp/persian-overhaul.b64 > /tmp/persian-overhaul.tar.gz
          echo "0953539c56ddb5a39eadc49b0eeb88369547735d44def1e6bb020a307b32cc0f  /tmp/persian-overhaul.tar.gz" | sha256sum --check
          tar -xzf /tmp/persian-overhaul.tar.gz -C .
          rm -rf .codex-persian
          rm -f .codex-test-local-path
          rm -f .github/workflows/apply-persian-full-bleed.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Persian experience as a full-bleed visual narrative"
          git push origin HEAD:codex/persian-full-bleed-overhaul
