---
layout: default
---

<main class="cosmos-page-shell" role="main">
  <article class="cosmos-page">
    <header class="cosmos-page__header">
      {% if page.eyebrow %}<p class="section-kicker">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="cosmos-page__description">{{ page.description }}</p>{% endif %}
    </header>
    <div class="cosmos-page__content">
      {{ content }}
    </div>
  </article>
</main>
